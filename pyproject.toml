[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "trap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "requests"]
description = "Searching pure noise for trading strategies, then deflating the winner."
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "pandas-stubs", "types-requests", "pre-commit"]

[project.scripts]
faketrap = "trap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
